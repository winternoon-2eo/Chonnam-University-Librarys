name: VibeLib Daily Cache Pre-warmer

on:
  schedule:
    # Runs every day at 04:00 AM KST (19:00 UTC)
    - cron: '0 19 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions web UI anytime

jobs:
  prewarm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Start Next.js local server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run start -- -p 3000 &
          npx wait-on http://localhost:3000/api/curate?q=test -t 60000

      - name: Execute Cache Pre-warmer
        env:
          VIBELIB_BASE_URL: http://localhost:3000
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/prewarm-cache.mjs
